seed: 13
train_path: data/processed/pi1m_no_tg.parquet
output_dir: checkpoints/B_MLM
model:
  layers: 8
  hidden_size: 512
  attention_heads: 8
  intermediate_size: 2048
  dropout: 0.1
  max_sequence_length: 192
training:
  epochs: 3
  effective_batch_size: 256
  batch_size: 16
  gradient_accumulation_steps: 16
  lr: 0.0002
  warmup_fraction: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  mask_probability: 0.15
  mixed_precision: true
